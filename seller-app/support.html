<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Support</title><link rel="stylesheet" href="seller.css"></head><body><div class="app"><aside><a class="brand" href="index.html"><div class="logo">PM</div><div><h1>PasarMalam</h1><div class="label">Seller Centre</div></div></a><nav><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="returns.html">Returns</a><a href="messages.html">Messages</a><a href="logistics.html">Logistics</a><a href="wallet.html">Wallet</a><a href="campaigns.html">Campaigns</a><a href="reviews.html">Reviews</a><a href="notifications.html">Notifications</a><a class="active" href="support.html">Support</a><a href="settings.html">Settings</a></nav></aside><div><header><div class="top"><div><h2>Seller Support</h2><span>Raise payout, logistics, product, order, verification or technical issues.</span></div><button class="soft" onclick="loadTickets()">Refresh</button></div></header><main><section class="two"><div class="panel"><h3>Open Ticket</h3><label>Category</label><select id="category"><option>Payout</option><option>Order</option><option>Logistics / AWB</option><option>Product Listing</option><option>SSM / Verification</option><option>Technical</option></select><label>Priority</label><select id="priority"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option><option value="low">Low</option></select><label>Subject</label><input id="subject" placeholder="Subject"><label>Message</label><textarea id="message" rows="6" placeholder="Explain the issue clearly"></textarea><button class="primary" onclick="createTicket()">Submit Ticket</button><p id="status" class="muted"></p></div><div class="panel"><h3>My Tickets</h3><div id="list">Loading...</div></div></section></main></div></div><script>const API="https://pasarmalam-backend.onrender.com";function token(){return localStorage.getItem("pm_token")||""}async function api(path,options={}){const headers={"Content-Type":"application/json",...(options.headers||{})};if(token())headers.Authorization=`Bearer ${token()}`;const r=await fetch(API+path,{...options,headers});const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error(d.error||"Request failed");return d}function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}function dt(ts){return ts?new Date(Number(ts)*1000).toLocaleString():"-"}async function createTicket(){try{if(!token())throw new Error("Please sign in first.");const d=await api("/api/support/tickets",{method:"POST",body:JSON.stringify({role:"seller",category:category.value,priority:priority.value,subject:subject.value,message:message.value})});status.textContent=`Ticket #${d.id} submitted.`;subject.value="";message.value="";loadTickets()}catch(e){status.textContent=e.message}}async function loadTickets(){try{const d=await api("/api/support/tickets");list.innerHTML=(d.tickets||[]).map(t=>`<div class="item"><b>#${t.id} ${esc(t.subject)}</b> <span class="tag">${esc(t.status)}</span><p>${esc(t.message)}</p><div class="muted">${esc(t.category)} | ${esc(t.priority)} | ${dt(t.created_at)}</div>${t.admin_response?`<p><b>Admin:</b> ${esc(t.admin_response)}</p>`:""}</div>`).join("")||"<p class='muted'>No tickets yet.</p>"}catch(e){list.textContent=e.message}}loadTickets()</script></body></html>
