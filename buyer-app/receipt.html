<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PasarMalam Receipt</title>
  <style>:root{--brand:#0f9f8f;--purple:#6d5dfc;--line:#e6e9ef;--muted:#687282;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#202124}header{background:linear-gradient(180deg,var(--brand),var(--purple));color:#fff}.bar,main{max-width:860px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}.brand{display:flex;gap:10px;align-items:center;cursor:pointer}.logo{width:50px;height:50px;border-radius:13px;background:conic-gradient(from 160deg,var(--brand),var(--purple),#e43f8f,var(--brand));display:grid;place-items:center;font-weight:900;box-shadow:inset 0 0 0 3px #ffffffcc}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;margin:16px}.soft,.primary{border-radius:6px;min-height:38px;padding:0 14px;font-weight:900}.soft{background:#fff;color:var(--brand);border:1px solid #b8fff5}.primary{background:var(--brand);color:#fff;border:0}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{border-bottom:1px solid var(--line);padding:10px;text-align:left}.right{text-align:right}.total{font-size:22px;font-weight:900;color:var(--brand)}@media print{header,.actions{display:none}body{background:#fff}.panel{border:0;margin:0}}@media(max-width:700px){.bar{align-items:flex-start;gap:8px;flex-direction:column}}</style>
</head>
<body><header><div class="bar"><div class="brand" onclick="location.href='index.html'"><div class="logo">PM</div><div><h2>PasarMalam</h2><div>Receipt</div></div></div><button class="soft" onclick="location.href='orders.html'">Orders</button></div></header><main><section class="panel" id="receipt">Loading receipt...</section><section class="panel actions"><button class="primary" onclick="window.print()">Print / Save PDF</button> <button class="soft" id="trackBtn">Track Order</button> <button class="soft" onclick="location.href='index.html'">Continue Shopping</button></section></main><script>
const API="https://pasarmalam-backend.onrender.com",id=new URLSearchParams(location.search).get("id");function token(){return localStorage.getItem("pm_token")||""}function money(v){return `RM${Number(v||0).toFixed(2)}`}function fmt(ts){return ts?new Date(Number(ts)*1000).toLocaleString():"-"}async function load(){const headers={};if(token())headers.Authorization=`Bearer ${token}`;const data=await (await fetch(API+"/api/orders",{headers})).json();const o=(data.orders||[]).find(x=>String(x.id)===String(id))||(data.orders||[])[0];if(!o){receipt.innerHTML="<p>No receipt found.</p>";return}trackBtn.onclick=()=>location.href=`order-detail.html?id=${o.id}`;receipt.innerHTML=`<h2>Receipt</h2><p class="muted">PasarMalam order receipt for buyer records.</p><table><tr><th>Order</th><td>PM-${o.id}</td></tr><tr><th>Date</th><td>${fmt(o.created_at)}</td></tr><tr><th>Buyer</th><td>${o.buyer_name||"-"}</td></tr><tr><th>Payment</th><td>${o.payment_method||"-"} | ${o.payment_status||"-"} | Ref ${o.payment_reference||"-"}</td></tr><tr><th>Fulfillment</th><td>${o.order_status||"-"} | ${o.logistics_method||"-"} | Tracking ${o.tracking_no||"-"}</td></tr><tr><th>Address</th><td>${o.address||"-"}</td></tr></table><table><thead><tr><th>Item</th><th class="right">Qty</th><th class="right">Amount</th></tr></thead><tbody><tr><td>Product #${o.product_id}${o.variant?`<div class="muted">Variant: ${o.variant}</div>`:""}</td><td class="right">${o.quantity||1}</td><td class="right">${money(Number(o.total||0)-Number(o.logistics_fee||0))}</td></tr><tr><td>Shipping</td><td class="right">1</td><td class="right">${money(o.logistics_fee)}</td></tr><tr><td colspan="2" class="right total">Total</td><td class="right total">${money(o.total)}</td></tr></tbody></table><p class="muted">Escrow status: ${o.escrow_status||"-"}. This receipt does not collect or store card numbers.</p>`}load().catch(e=>receipt.innerHTML=`<p>${e.message}</p>`);
</script><script src="badges.js"></script></body></html>
