<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PasarMalam Support</title><style>:root{--brand:#0f9f8f;--purple:#6d5dfc;--line:#e6e9ef;--muted:#687282;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#202124}button,input,select,textarea{font:inherit}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px}header{background:linear-gradient(180deg,var(--brand),var(--purple));color:#fff}.bar,main{max-width:980px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}.brand{display:flex;gap:10px;align-items:center;cursor:pointer}.logo{width:50px;height:50px;border-radius:13px;background:conic-gradient(from 160deg,var(--brand),var(--purple),#e43f8f,var(--brand));display:grid;place-items:center;font-weight:900;box-shadow:inset 0 0 0 3px #ffffffcc}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary,.soft{border-radius:6px;min-height:38px;padding:0 14px;font-weight:900}.primary{border:0;background:var(--brand);color:#fff}.soft{background:#fff;color:var(--brand);border:1px solid #b8fff5}.muted{color:var(--muted);font-size:13px}.item{border:1px solid var(--line);border-radius:6px;background:#fafafa;padding:10px;margin:8px 0}.tag{display:inline-block;border-radius:999px;border:1px solid #b8fff5;background:#f0fffc;color:var(--brand);padding:4px 8px;font-size:12px;font-weight:900}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><header><div class="bar"><div class="brand" onclick="location.href='index.html'"><div class="logo">PM</div><div><h2>PasarMalam</h2><div>Buyer Support</div></div></div><button class="soft" onclick="location.href='profile.html'">Profile</button></div></header><main><section class="panel"><h2>Open Support Ticket</h2><p class="muted">Use this for payment, order, seller, return, refund, login or account issues.</p><div class="row"><select id="category"><option>Order</option><option>Payment</option><option>Return / Refund</option><option>Seller Issue</option><option>Account</option><option>Technical</option></select><select id="priority"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option><option value="low">Low</option></select></div><input id="subject" placeholder="Subject"><textarea id="message" rows="5" placeholder="Explain what happened, include order ID if any"></textarea><button class="primary" onclick="createTicket()">Submit Ticket</button><p id="status" class="muted"></p></section><section class="panel"><div class="row"><h2>My Tickets</h2><button class="soft" onclick="loadTickets()">Refresh</button></div><div id="list">Loading...</div></section></main><script>const API="https://pasarmalam-backend.onrender.com";function token(){return localStorage.getItem("pm_token")||""}async function api(path,options={}){const headers={"Content-Type":"application/json",...(options.headers||{})};if(token())headers.Authorization=`Bearer ${token()}`;const r=await fetch(API+path,{...options,headers});const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error(d.error||"Request failed");return d}function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}function dt(ts){return ts?new Date(Number(ts)*1000).toLocaleString():"-"}async function createTicket(){try{if(!token())throw new Error("Please login first.");const d=await api("/api/support/tickets",{method:"POST",body:JSON.stringify({role:"buyer",category:category.value,priority:priority.value,subject:subject.value,message:message.value})});status.textContent=`Ticket #${d.id} submitted.`;subject.value="";message.value="";loadTickets()}catch(e){status.textContent=e.message}}async function loadTickets(){try{const d=await api("/api/support/tickets");list.innerHTML=(d.tickets||[]).map(t=>`<div class="item"><b>#${t.id} ${esc(t.subject)}</b> <span class="tag">${esc(t.status)}</span><p>${esc(t.message)}</p><div class="muted">${esc(t.category)} | ${esc(t.priority)} | ${dt(t.created_at)}</div>${t.admin_response?`<p><b>Admin:</b> ${esc(t.admin_response)}</p>`:""}</div>`).join("")||"<p class='muted'>No tickets yet.</p>"}catch(e){list.textContent=e.message}}loadTickets()</script></body></html>
