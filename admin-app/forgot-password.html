<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot Admin Password - PasarMalam</title>
  <link rel="stylesheet" href="admin.css?v=admin-logo1">
  <link rel="icon" type="image/jpeg" href="admin-logo.jpg">
</head>
<body>
  <main class="login"><div class="panel">
    <img class="logo" src="admin-logo.jpg" alt="PasarMalam Admin" width="52" height="52">
    <h2>Forgot password?</h2>
    <p class="muted">Enter your registered admin email to receive a password reset link.</p>
    <form id="recoveryForm">
      <label for="email">Admin email</label>
      <input id="email" name="email" type="email" autocomplete="username" required placeholder="Admin email">
      <p><button class="primary" id="sendReset" type="submit">Send reset link</button></p>
    </form>
    <p id="status" class="muted" role="status" aria-live="polite"></p>
    <p><a href="login.html">Back to login</a></p>
  </div></main>
  <script src="forgot-password.js?v=1"></script>
</body>
</html>
