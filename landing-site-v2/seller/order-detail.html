<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Order Detail</title><link rel="stylesheet" href="seller.css"><script src="seller-auth-guard.js"></script><style>.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{border:1px solid #e5e7eb;border-radius:8px;background:#fff;padding:12px}.box b{display:block;font-size:20px;color:#0f9f8f;margin-top:4px}.warn{background:#fff8e8;border-color:#fde68a;color:#92400e}.bad{background:#fff0f3;border-color:#fecdd3;color:#be123c}.ok{background:#effdfa;border-color:#b8fff5;color:#067647}.locked{opacity:.55;pointer-events:none}@media(max-width:760px){.status-grid{grid-template-columns:1fr}}</style></head><body><div class="app"><aside><a class="brand" href="index.html"><div class="logo">PM</div><div><h1>PasarMalam</h1><div class="label">Seller Centre</div></div></a><nav><a href="index.html">Dashboard</a><a href="products.html">Products</a><a class="active" href="orders.html">Orders</a><a href="returns.html">Returns</a><a href="messages.html">Messages</a><a href="logistics.html">Logistics</a><a href="wallet.html">Wallet</a><a href="campaigns.html">Campaigns</a><a href="reviews.html">Reviews</a><a href="notifications.html">Notifications</a><a href="support.html">Support</a><a href="settings.html">Settings</a></nav></aside><div><header><div class="top"><h2>Order Detail</h2><button class="soft" onclick="location.href='orders.html'">Orders</button></div></header><main><section class="panel" id="detail">Loading...</section><section class="panel"><h3>Seller Actions</h3><div id="lockNotice"></div><div class="row" id="actionRow"><select id="status"><option value="to_pack">To Pack</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><input id="tracking" placeholder="Tracking / rider note"><button class="primary" onclick="update()">Save Update</button></div><button class="soft" id="awbBtn" onclick="awb()">Generate AWB</button> <button class="soft" id="chatBtn">Message Buyer</button><p id="out" class="muted"></p></section></main></div></div><script>
const API="https://pasarmalam-backend.onrender.com";const id=new URLSearchParams(location.search).get("id");let order=null;async function api(p,o={}){const token=localStorage.getItem("pm_token")||"",headers={"Content-Type":"application/json",...(o.headers||{})};if(token)headers.Authorization=`Bearer ${token}`;const r=await fetch(API+p,{...o,headers});const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error(d.error||"Request failed");return d}function cleanStatus(s){if(["placed","paid","packed"].includes(s))return"to_pack";return s||"to_pack"}function money(v){return`RM${Number(v||0).toFixed(2)}`}function fmt(ts){return ts?new Date(Number(ts)*1000).toLocaleString():"Not set"}function remain(ts){if(!ts)return"-";const s=Number(ts)-Math.floor(Date.now()/1000);if(s<=0)return"Expired";return`${Math.floor(s/86400)}d ${Math.floor((s%86400)/3600)}h`}function escrowLabel(s){return{holding:"Holding",released:"Released",dispute_hold:"Dispute hold",refund_approved:"Refund approved",refund_rejected:"Refund rejected",refunded:"Refunded",cancelled:"Cancelled",pending:"Pending"}[s]||s}function paymentClass(s){return s==="paid"?"ok":s==="pending"||s==="unpaid"?"warn":"bad"}function setLocked(locked){actionRow.classList.toggle("locked",locked);awbBtn.disabled=locked;lockNotice.innerHTML=locked?`<div class="box warn"><b>Fulfillment locked</b><p>Payment is not confirmed. Do not pack, ship or generate AWB until Billplz marks this order paid.</p></div>`:`<div class="box ok"><b>Fulfillment enabled</b><p>Payment is confirmed. You can prepare and update this order.</p></div>`}async function load(){try{const rows=(await api("/api/orders")).orders||[];order=rows.find(x=>String(x.id)===String(id))||rows[0];if(!order){detail.innerHTML="<p>No order found.</p>";return}const unpaid=order.payment_status!=="paid";status.value=cleanStatus(order.order_status);tracking.value=order.tracking_no||"";setLocked(unpaid);chatBtn.onclick=()=>location.href=`messages.html?order_id=${order.id}`;detail.innerHTML=`<h3>PM-${order.id}</h3><div class="status-grid"><div class="box ${paymentClass(order.payment_status)}"><span>Payment</span><b>${order.payment_status}</b></div><div class="box"><span>Order</span><b>${order.order_status}</b></div><div class="box"><span>Escrow</span><b>${escrowLabel(order.escrow_status)}</b></div></div><div class="box"><p><b>Total:</b> ${money(order.total)} | <b>Shipping:</b> ${order.logistics_method||"-"} ${money(order.logistics_fee)}</p><p><b>Payment reference:</b> ${order.payment_reference||"-"}</p>${order.payment_url?`<p><a href="${order.payment_url}" target="_blank">Open gateway payment link</a></p>`:""}<p><b>Tracking:</b> ${order.tracking_no||"-"}</p><p><b>Address:</b> ${order.address||"-"}</p><p class="muted">Delivered: ${fmt(order.delivered_at)} | Completed: ${fmt(order.completed_at)}</p><p class="muted">Return deadline: ${remain(order.return_deadline_at)} | Escrow release: ${remain(order.escrow_release_at)}</p></div>`}catch(e){detail.innerHTML=`<p class='muted'>${e.message}</p>`}}async function update(){try{if(!order)throw new Error("No order selected.");if(order.payment_status!=="paid")throw new Error("Payment is not confirmed. Fulfillment is locked.");await api("/api/orders/status",{method:"POST",body:JSON.stringify({order_id:order.id,order_status:status.value,tracking_no:tracking.value})});out.textContent="Order updated.";await load()}catch(e){out.textContent=e.message}}async function awb(){try{if(!order)throw new Error("No order selected.");if(order.payment_status!=="paid")throw new Error("Payment is not confirmed. AWB is locked.");const r=await api("/api/logistics/awb",{method:"POST",body:JSON.stringify({order_id:order.id})});out.textContent=r.print_text}catch(e){out.textContent=e.message}}load();</script><script src="badges.js"></script></body></html>
