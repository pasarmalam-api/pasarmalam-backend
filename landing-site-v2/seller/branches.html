<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Store Branches - PasarMalam</title><link rel="icon" href="seller-logo.jpg"><link rel="stylesheet" href="seller.css?v=role-switch2"><link rel="stylesheet" href="branches.css?v=1">
<script src="seller-session.js?v=role-switch1"></script><script src="seller-auth-guard.js?v=seller-audit3"></script>
<style>.branch-section{padding:20px 0;border-bottom:1px solid #d7e2df}.branch-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.branch-fields label{min-width:0}.branch-wide{grid-column:1/-1}.branch-check{display:flex;align-items:center;gap:10px}.branch-check input{width:auto}.branch-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.branch-toolbar select{max-width:420px}.branch-table{overflow:auto}.branch-table table{width:100%;border-collapse:collapse}.branch-table th,.branch-table td{padding:10px;text-align:left;border-bottom:1px solid #d7e2df}.branch-table input{min-width:110px;max-width:160px}#branchGoogle{margin:12px 0}#branchGoogle gmp-place-autocomplete{width:100%}#branchFeedback{min-height:24px;overflow-wrap:anywhere}main h3{font-size:18px}main{max-width:1100px}@media(max-width:650px){.branch-fields{grid-template-columns:1fr}.branch-wide{grid-column:auto}}</style></head>
<body><div class="app"><aside><a class="brand" href="index.html"><img class="logo" src="seller-logo.jpg" alt="PasarMalam" width="46" height="46"><div><h1>PasarMalam</h1><div class="label">Seller Centre</div></div></a><nav><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="logistics.html">Logistics</a><a href="settings.html">Settings</a><a class="active" href="branches.html">Branches</a></nav></aside>
<div><header><div class="top"><h2>Store Branches</h2><a class="soft" href="settings.html">Back to Settings</a></div></header><main>
<section class="branch-section"><div class="branch-toolbar"><label for="branchSelect">Branch</label><select id="branchSelect" disabled><option>Loading...</option></select><button class="primary" id="branchNew" disabled>Add branch</button><button class="soft" id="branchReload">Refresh</button><a href="logistics.html">Main store pickup</a></div><p id="branchFeedback" role="status"></p></section>
<form id="branchForm"><fieldset id="branchFields" disabled style="border:0;padding:0;margin:0">
<section class="branch-section"><h3 id="branchTitle">New branch</h3><div class="branch-fields">
<label>Branch name<input id="branchName" maxlength="100" required></label><label>Contact phone<input id="branchPhone" type="tel" maxlength="40" required></label>
<div class="branch-wide"><button type="button" class="soft" id="branchSearch">Search Malaysian address</button><div id="branchGoogle"></div></div>
<label class="branch-wide">Pickup address<textarea id="branchPickupAddress" maxlength="1000" required></textarea></label>
<label>Latitude<input id="branchLat" type="number" step="any" min="0" max="8" required></label><label>Longitude<input id="branchLng" type="number" step="any" min="99" max="120" required></label>
<label class="branch-check branch-wide"><input id="branchConfirmed" type="checkbox" required>Pickup location confirmed</label>
<label class="branch-check"><input id="branchOpen" type="checkbox" checked>Open for orders</label><label class="branch-check"><input id="branchActive" type="checkbox" checked>Visible to buyers</label></div></section>
<section class="branch-section"><h3>Product Prices</h3><div class="branch-table"><table><thead><tr><th>Product</th><th>Shared stock</th><th>Base price (RM)</th><th>Branch price (RM)</th></tr></thead><tbody id="branchProducts"></tbody></table></div></section>
<section class="branch-section"><button class="primary" id="branchSave" type="submit">Save branch</button></section>
</fieldset></form><section class="branch-section"><h3>Branch Orders</h3><div id="branchOrders"></div></section>
</main></div></div><script src="branches.js?v=1"></script><script src="seller-actions.js?v=branches1"></script><script src="badges.js?v=audit2"></script></body></html>
