<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PasarMalam Pickup Location</title><link rel="stylesheet" href="seller.css?v=role-switch2">
<script src="seller-session.js?v=role-switch1"></script><script src="seller-auth-guard.js?v=seller-audit3"></script><link rel="icon" type="image/jpeg" href="seller-logo.jpg"></head>
<body><div class="app"><aside><a class="brand" href="index.html"><img class="logo" src="seller-logo.jpg" alt="PasarMalam" width="46" height="46"><h1>PasarMalam</h1></a>
<nav><a href="index.html">Dashboard</a><a href="store-profile.html">Store Profile</a><a href="products.html">Products</a><a href="orders.html">Orders</a></nav></aside>
<div><header><div class="top"><h2>Lokasi Pengambilan</h2><a href="store-profile.html">Kembali</a></div></header>
<main><form id="pickupForm" style="max-width:640px">
<label for="pickupAddress">Alamat pengambilan</label><textarea id="pickupAddress" required maxlength="1000"></textarea>
<button type="button" id="locate" class="soft">Gunakan lokasi semasa</button>
<label for="lat">Latitud</label><input id="lat" type="number" step="any" min="-90" max="90" required>
<label for="lng">Longitud</label><input id="lng" type="number" step="any" min="-180" max="180" required>
<label for="deliveryCity">Kawasan penghantaran tempatan</label><select id="deliveryCity"><option value="">Pilih kawasan</option></select>
<label for="deliveryVehicle">Kenderaan untuk bungkusan kedai</label><select id="deliveryVehicle"><option value="">Pilih kenderaan</option></select>
<p id="vehicleLimit"></p>
<label style="display:block;margin:16px 0"><input id="confirmed" type="checkbox" required style="width:auto"> Saya sahkan koordinat sepadan dengan alamat pengambilan.</label>
<button id="savePickup" class="primary" type="submit">Simpan lokasi</button><p id="status" role="status"></p>
</form></main></div></div>
<script>
(() => {
  const $=id=>document.getElementById(id), token=localStorage.getItem('pm_token')||'';
  async function api(options){const r=await fetch('https://pasarmalam-backend.onrender.com/api/delivery/pickup',{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d;}
  for(const id of ['pickupAddress','lat','lng'])$(id).oninput=()=>{$('confirmed').checked=false;};
  $('locate').onclick=()=>{
    if(!navigator.geolocation){$('status').textContent='Lokasi tidak tersedia.';return;}
    $('status').textContent='Mencari lokasi...';
    navigator.geolocation.getCurrentPosition(p=>{$('lat').value=p.coords.latitude.toFixed(6);$('lng').value=p.coords.longitude.toFixed(6);$('confirmed').checked=false;$('status').textContent='';},()=>{$('status').textContent='Lokasi tidak dibenarkan. Masukkan koordinat alamat.';},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  };
  let cities=[],savedPickup;
  $('deliveryCity').disabled=true;$('deliveryVehicle').disabled=true;
  function vehicles(){const services=cities.find(c=>c.locode===$('deliveryCity').value)?.services||[];$('deliveryVehicle').replaceChildren(new Option('Pilih kenderaan',''),...services.map(s=>new Option(s.key.replaceAll('_',' '),s.key)));}
  function limit(){const s=cities.find(c=>c.locode===$('deliveryCity').value)?.services.find(s=>s.key===$('deliveryVehicle').value);$('vehicleLimit').textContent=s?`${s.load?.value||''} ${s.load?.unit||''} | ${Object.values(s.dimensions||{}).map(d=>d.value+' '+d.unit).join(' x ')}`:'';}
  $('deliveryCity').onchange=()=>{vehicles();limit();};$('deliveryVehicle').onchange=limit;
  $('pickupForm').onsubmit=async e=>{e.preventDefault();$('savePickup').disabled=true;try{await api({method:'POST',body:JSON.stringify({address:$('pickupAddress').value.trim(),coordinates:{lat:$('lat').value,lng:$('lng').value},confirmed:$('confirmed').checked,city:$('deliveryCity').disabled?(savedPickup?.city||''):$('deliveryCity').value,service_type:$('deliveryVehicle').disabled?(savedPickup?.service_type||''):$('deliveryVehicle').value})});$('status').textContent='Lokasi pengambilan disimpan.';}catch(e){$('status').textContent=e.message;}finally{$('savePickup').disabled=false;}};
  $('savePickup').disabled=true;
  api().then(async d=>{savedPickup=d.pickup;if(d.pickup){$('pickupAddress').value=d.pickup.address;$('lat').value=d.pickup.coordinates.lat;$('lng').value=d.pickup.coordinates.lng;}else{try{$('pickupAddress').value=JSON.parse(localStorage.getItem('pm_user')||'{}').address||'';}catch(e){}}$('savePickup').disabled=false;
    try{const r=await fetch('https://pasarmalam-backend.onrender.com/api/delivery/services',{headers:{Authorization:'Bearer '+token}});const v=await r.json();if(!r.ok)throw new Error(v.error||'Delivery settings unavailable');cities=v.cities||[];$('deliveryCity').replaceChildren(new Option('Pilih kawasan',''),...cities.map(c=>new Option(c.name,c.locode)));$('deliveryCity').value=savedPickup?.city||'';vehicles();$('deliveryVehicle').value=savedPickup?.service_type||'';limit();$('deliveryCity').disabled=false;$('deliveryVehicle').disabled=false;}catch(e){$('status').textContent=e.message;}
  }).catch(e=>{$('status').textContent=e.message;});
})();
</script><script src="seller-actions.js?v=branches1"></script><script src="badges.js?v=audit2"></script></body></html>
