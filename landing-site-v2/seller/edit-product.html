<!doctype html><html lang="ms"><head><script src="shop-category.js?v=groceries1"></script><script src="seller-session.js?v=role-switch1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Product</title><link rel="stylesheet" href="seller.css?v=role-switch2"><script src="seller-auth-guard.js?v=seller-audit3"></script><link rel="icon" type="image/jpeg" href="seller-logo.jpg"></head><body><div class="app"><aside><a class="brand" href="index.html"><img class="logo" src="seller-logo.jpg" alt="PasarMalam" width="46" height="46"><div><h1>PasarMalam</h1><div class="label">Seller Centre</div></div></a><nav><a href="index.html">Dashboard</a><a class="active" href="products.html">Products</a><a href="orders.html">Orders</a><a href="campaigns.html">Campaigns</a><a href="performance.html">Performance</a></nav></aside><div><header><div class="top"><h2>Edit Product</h2><button class="soft" onclick="location.href='products.html'">Product List</button></div></header><main><section class="panel"><h3>Listing Editor</h3><div class="row"><input id="name" placeholder="Product name"><input id="price" placeholder="Price RM"></div><div class="row"><input id="stock" placeholder="Stock"><select id="category" aria-label="Shop category" disabled><option value="">Shop category</option></select></div><div id="shopCategoryControls"><a href="settings.html" data-shop-category-text="settings">Shop Settings</a><p role="status" aria-live="polite"></p><button type="button" class="soft" data-category-retry data-shop-category-text="retry" hidden>Retry</button></div><div class="row"><select id="condition"><option>New</option><option>Used</option></select><select id="priceMode"><option>Fixed</option><option>Negotiable</option></select></div><input id="variants" placeholder="Variants"><div id="previewGrid"></div><label>Weight per item / food portion (grams, including packaging)<input id="weight" type="number" min="1" step="1" required></label><textarea id="desc" placeholder="Description"></textarea><div class="row"><button class="primary" onclick="save()">Save Changes</button><button class="danger" onclick="removeProduct()">Delete Product</button></div><p id="out" class="muted"></p></section></main></div></div><script src="product-photos.js?v=1"></script><script>
let images=[],productLoaded=false;const API="https://pasarmalam-backend.onrender.com";const id=new URLSearchParams(location.search).get("id")||"";async function api(p,o={}){const token=localStorage.getItem("pm_token")||"",headers={"Content-Type":"application/json",...(o.headers||{})};if(token)headers.Authorization=`Bearer ${token}`;const r=await fetch(API+p,{...o,headers});const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error(d.error||"Request failed");return d}async function load(){try{const p=(await api("/api/products")).products.find(x=>String(x.id)===String(id));if(!p){out.textContent="Product not found.";return}document.getElementById("name").value=p.name;price.value=p.price;weight.value=Number(p.weight_kg)*1000;stock.value=p.stock;await PMShopCategory.ready;condition.value=p.condition;priceMode.value=p.price_mode;variants.value=(p.variants||[]).join(", ");desc.value=p.description||"";images=Array.isArray(p.images)?p.images.slice():(p.image_url?[p.image_url]:[]);renderProductPhotos(images);productLoaded=true}catch(e){out.textContent=e.message}}async function save(){try{if(!productLoaded)throw new Error("Open a product from the product list first.");if(!weight.reportValidity()||!Number(weight.value))throw new Error("Enter the packed weight in grams.");await api("/api/products/"+id,{method:"PUT",body:JSON.stringify({name:document.getElementById("name").value,category:await PMShopCategory.require(),price:Number(price.value),stock:Number(stock.value),weight_kg:Number(weight.value)/1000,condition:condition.value,price_mode:priceMode.value,variants:variants.value.split(",").map(x=>x.trim()).filter(Boolean),description:desc.value,images})});out.textContent="Product updated."}catch(e){out.textContent=e.message}}async function removeProduct(){try{if(!confirm("Delete this product?"))return;await api("/api/products/"+id,{method:"DELETE"});out.textContent="Product deleted.";setTimeout(()=>location.href="products.html",600)}catch(e){out.textContent=e.message}}load();
</script><script src="seller-actions.js?v=branches1"></script><script src="badges.js?v=accessories1"></script></body></html>
