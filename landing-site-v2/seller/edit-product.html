<!doctype html><html lang="ms"><head><script src="shop-category.js?v=cosmetics1"></script><script src="seller-session.js?v=shops-20261009"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Product</title><link rel="stylesheet" href="seller.css?v=bulk1"><script src="seller-auth-guard.js?v=seller-audit3"></script><link rel="icon" type="image/jpeg" href="seller-logo.jpg"></head><body><div class="app"><aside><a class="brand" href="index.html"><img class="logo" src="seller-logo.jpg" alt="PasarMalam" width="46" height="46"><div><h1>PasarMalam</h1><div class="label">Seller Centre</div></div></a><nav><a href="index.html">Dashboard</a><a class="active" href="products.html">Products</a><a href="orders.html">Orders</a><a href="campaigns.html">Campaigns</a><a href="performance.html">Performance</a></nav></aside><div><header><div class="top"><h2>Edit Product</h2><button class="soft" onclick="location.href='products.html'">Product List</button></div></header><main><section class="panel"><h3>Listing Editor</h3><div class="row"><input id="name" placeholder="Product name"><input id="price" placeholder="Price per unit (RM)" aria-label="Price per unit (RM)"></div><div class="row"><input id="stock" placeholder="Stock"><select id="category" aria-label="Shop category" disabled><option value="">Shop category</option></select></div><div id="shopCategoryControls"><a href="settings.html" data-shop-category-text="settings">Shop Settings</a><p role="status" aria-live="polite"></p><button type="button" class="soft" data-category-retry data-shop-category-text="retry" hidden>Retry</button></div><div class="row"><label>Selling type<select id="sellingMode" onchange="minimumOrder.disabled=this.value!=='bulk';minimumOrder.min=this.value==='bulk'?2:1;minimumOrder.value=this.value==='bulk'?Math.max(2,Number(minimumOrder.value)):1"><option value="retail">Retail</option><option value="bulk">Bulk / Wholesale</option></select></label><label>Minimum order (units)<input id="minimumOrder" type="number" min="1" step="1" value="1" required disabled></label></div><div class="row"><select id="condition"><option>New</option><option>Used</option></select><select id="priceMode"><option>Fixed</option><option>Negotiable</option></select></div><input id="variants" placeholder="Variants"><div id="previewGrid"></div><label>Packed weight per item<input id="weight" type="number" min="0.000001" step="any" required inputmode="decimal" placeholder="e.g. 0.5" aria-label="Packed weight"><select id="weightUnit" aria-label="Weight unit"><option value="g">g</option><option value="kg">kg</option></select><output id="weightEquivalent" aria-live="polite"></output></label><label>Storage classification<select id="storageClass"><option value="unknown">Not specified</option><option value="shelf_stable">Shelf-stable groceries (no refrigeration)</option><option value="canned_drink">Sealed canned drink (no refrigeration)</option><option value="perishable">Fresh / hot / chilled / frozen / perishable</option></select></label><textarea id="desc" placeholder="Description"></textarea><div class="row"><button class="primary" onclick="save()">Save Changes</button><button class="danger" onclick="removeProduct()">Delete Product</button></div><p id="out" class="muted"></p></section></main></div></div><script src="product-fields.js?v=20261010"></script><script src="product-photos.js?v=1"></script><script>
let images=[],productLoaded=false;const API="https://pasarmalam-backend.onrender.com";const id=new URLSearchParams(location.search).get("id")||"";async function api(p,o={}){const token=localStorage.getItem("pm_token")||"",headers={"Content-Type":"application/json",...(o.headers||{})};if(token)headers.Authorization=`Bearer ${token}`;const r=await fetch(API+p,{...o,headers});const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error(d.error||"Request failed");return d}async function load(){try{const p=(await api("/api/products")).products.find(x=>String(x.id)===String(id));if(!p){out.textContent="Product not found.";return}document.getElementById("name").value=p.name;price.value=p.price;PMProductFields.load(p);stock.value=p.stock;sellingMode.value=p.selling_mode||"retail";minimumOrder.disabled=sellingMode.value!=="bulk";minimumOrder.min=sellingMode.value==="bulk"?2:1;minimumOrder.value=p.minimum_order||1;await PMShopCategory.ready;condition.value=p.condition;priceMode.value=p.price_mode;variants.value=(p.variants||[]).join(", ");desc.value=p.description||"";images=Array.isArray(p.images)?p.images.slice():(p.image_url?[p.image_url]:[]);renderProductPhotos(images);productLoaded=true}catch(e){out.textContent=e.message}}async function save(){try{if(!productLoaded)throw new Error("Open a product from the product list first.");if(!weight.reportValidity()||!Number(weight.value))throw new Error("Enter a positive packed weight and select g or kg.");if(!minimumOrder.reportValidity())return;await api("/api/products/"+id,{method:"PUT",body:JSON.stringify({name:document.getElementById("name").value,category:await PMShopCategory.require(),price:Number(price.value),stock:Number(stock.value),selling_mode:sellingMode.value,minimum_order:Number(minimumOrder.value),...PMProductFields.read(),condition:condition.value,price_mode:priceMode.value,variants:variants.value.split(",").map(x=>x.trim()).filter(Boolean),description:desc.value,images})});out.textContent="Product updated."}catch(e){out.textContent=e.message}}async function removeProduct(){try{if(!confirm("Delete this product?"))return;await api("/api/products/"+id,{method:"DELETE"});out.textContent="Product deleted.";setTimeout(()=>location.href="products.html",600)}catch(e){out.textContent=e.message}}load();
</script><script src="seller-actions.js?v=branches1"></script><script src="badges.js?v=20261001c"></script></body></html>
