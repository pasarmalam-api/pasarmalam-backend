<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PasarMalam Category</title><style>:root{--brand:#0f9f8f;--purple:#6d5dfc;--pink:#e43f8f;--line:#e6e9ef;--muted:#687282;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg)}header{background:linear-gradient(180deg,var(--brand),var(--purple));color:#fff}.bar,main{max-width:1100px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}.brand{display:flex;gap:10px;align-items:center;cursor:pointer}.logo{width:50px;height:50px;border-radius:13px;background:conic-gradient(from 160deg,var(--brand),var(--purple),var(--pink),var(--brand));display:grid;place-items:center;font-weight:900;box-shadow:inset 0 0 0 3px #ffffffcc}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.photo{aspect-ratio:1/1;background:linear-gradient(135deg,var(--brand),var(--purple));display:grid;place-items:center;color:#fff;font-size:40px;font-weight:900}.body{padding:10px}.price{color:var(--brand);font-weight:900}.soft{background:#fff;color:var(--brand);border:1px solid #b8fff5;border-radius:6px;min-height:38px;padding:0 14px;font-weight:900}.muted{color:var(--muted);font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}</style><script src="catalogue-products.js?v=1"></script><script src="shop-status.js?v=1"></script><link rel="stylesheet" href="catalogue.css?v=3"><link rel="icon" type="image/png" href="pasarmalam-logo.png"><link rel="stylesheet" href="buyer-ui.css?v=2"></head><body class="buyer-page"><header><div class="bar"><div class="brand" onclick="location.href='index.html'"><a class="logo" href="index.html" title="Home"><img src="pasarmalam-logo.png" width="56" height="56" alt="PasarMalam"></a><div><h2>PasarMalam</h2><div id="title">Category</div></div></div><button class="soft" onclick="location.href='cart.html'">Cart</button></div></header><main><div class="grid" id="list"></div></main><script>
const API="https://pasarmalam-backend.onrender.com";const params=new URLSearchParams(location.search);const cat=params.get("category")||"All";const query=(params.get("q")||"").trim().toLowerCase();const money=v=>`RM${Number(v).toFixed(2)}`;function img(p){const src=(p.images&&p.images[0])||p.image_url;return src?`<img src="${src}" style="width:100%;height:100%;object-fit:cover">`:(p.category||"P")[0]}async function load(){title.textContent=query||cat;const rows=(await (await fetch(API+"/api/products")).json()).products.filter(p=>Number(p.stock||0)>0&&(cat==="All"||p.category===cat)&&(!query||[p.name,p.shop,p.category,p.description].join(" ").toLowerCase().includes(query)));list.innerHTML=(cat==="All"?PMCatalogue.mixShops(rows):rows).map(p=>`<article class="card" onclick="location.href='product.html?id=${p.id}'"><div class="photo">${img(p)}</div><div class="body"><b>${p.name}</b><p class="muted">${p.shop} | ${p.condition}</p>${PMShop.badge(p)}<p class="price">${money(p.price)}</p></div></article>`).join("")||"<p>Tiada produk tersedia.</p>"}load();
</script><script src="badges.js?v=role-switch2"></script><script src="buyer-ui.js?v=2"></script></body></html>
