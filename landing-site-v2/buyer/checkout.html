<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PasarMalam Checkout</title>
  <style>:root{--brand:#0f9f8f;--purple:#6d5dfc;--pink:#e43f8f;--line:#e6e9ef;--muted:#687282;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit}header{background:linear-gradient(180deg,var(--brand),var(--purple));color:#fff}.bar,main{max-width:1000px;margin:auto}main{padding-bottom:150px}.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}.brand{display:flex;gap:10px;align-items:center;cursor:pointer}.logo{width:50px;height:50px;border-radius:13px;background:conic-gradient(from 160deg,var(--brand),var(--purple),var(--pink),var(--brand));display:grid;place-items:center;font-weight:900;box-shadow:inset 0 0 0 3px #ffffffcc}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;margin:16px;padding:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary,.soft{border:0;border-radius:6px;min-height:38px;padding:0 14px;font-weight:900}.primary{background:var(--brand);color:#fff}.soft{background:#fff;color:var(--brand);border:1px solid #b8fff5}.muted{color:var(--muted);font-size:13px}.error{color:#be123c;font-weight:900}.ok{color:var(--brand);font-weight:900}.total{font-size:22px;font-weight:900;color:var(--brand)}@media(max-width:700px){.row{grid-template-columns:1fr}}.bar{gap:10px;flex-wrap:wrap}.brand{min-width:0}#deliveryControls label{margin-top:10px}#deliveryControls .row{margin-top:12px}#deliveryQuote{margin-top:12px}.checkout-summary{border-top:1px solid var(--line);margin:18px 0;padding-top:16px}</style>
<script src="shop-status.js?v=1"></script><link rel="icon" type="image/png" href="pasarmalam-logo.png"><link rel="stylesheet" href="buyer-ui.css?v=3"></head>
<body class="buyer-page buyer-checkout">
<header><div class="bar"><div class="brand"><a class="logo" href="index.html" title="Home"><img src="pasarmalam-logo.png" width="56" height="56" alt="PasarMalam"></a><div><h2>PasarMalam</h2><div>Bayar</div></div></div><button class="soft" onclick="location.href='cart.html'">Troli</button></div></header>
<main><h1>Bayar</h1><div class="checkout-layout"><div class="checkout-fields">
<section class="checkout-section"><h2>Alamat Penghantaran</h2>
<label for="address">Alamat penuh</label><textarea id="address" rows="3" autocomplete="street-address" placeholder="Rumah / unit, jalan, poskod, bandar dan negeri"></textarea>
<div class="row"><label for="buyerPhone">Nombor telefon<input id="buyerPhone" type="tel" autocomplete="tel" placeholder="01xxxxxxxx"></label><label for="buyerEmail">Emel untuk resit<input id="buyerEmail" type="email" autocomplete="email"></label></div></section>
<section class="checkout-section"><div class="row payment-row"><select id="shipping" aria-label="Penghantaran" onchange="renderSummary()"><option>Ambil Sendiri</option><option>Lalamove Biasa</option><option selected>Lalamove Segera</option></select><label for="payment">Kaedah bayaran<select id="payment"><option value="">Pilih kaedah bayaran</option><option value="Billplz">Billplz FPX</option><option value="Cash Pickup">Cash Pickup</option></select></label></div></section>
<details class="checkout-section"><summary>Voucher / kod promosi</summary><div class="row"><input id="voucher" aria-label="Voucher" placeholder="Kod promosi"><button class="soft" onclick="applyVoucher()" type="button">Guna Voucher</button></div><p id="voucherStatus" class="muted" role="status"></p></details>
</div><aside class="checkout-summary"><h2>Ringkasan Pesanan</h2><div id="summary" class="muted">Memuatkan ringkasan troli...</div><button class="primary" id="pay">Bayar Sekarang</button><div id="result" role="status"></div><details><summary>Perlindungan Pembeli</summary><p class="muted">Pesanan gateway kekal belum selesai sehingga Billplz mengesahkan bayaran. Pesanan berbayar disimpan dalam escrow sehingga diterima atau selesai.</p></details></aside></div></main><script>
const API_BASE="https://pasarmalam-backend.onrender.com";let checkoutItem=null,checkoutProduct=null,activeVoucher="",activeDiscount=0;
function currentUser(){try{return JSON.parse(localStorage.getItem("pm_user")||"{}")}catch(e){return {}}}
function token(){return localStorage.getItem("pm_token")||""}
function money(v){return `RM${Number(v||0).toFixed(2)}`}
async function api(p,o={}){const headers={"Content-Type":"application/json",...(o.headers||{})};if(token())headers.Authorization=`Bearer ${token()}`;const r=await fetch(API_BASE+p,{...o,headers});const d=await r.json().catch(async()=>({error:await r.text()}));if(!r.ok||d.error)throw new Error(d.error||"Request failed");return d}
function showError(msg){result.textContent=msg;result.className="error"}
function shippingFee(){return window.pmDeliveryFee ? window.pmDeliveryFee() : NaN}
function subtotal(){return Number(checkoutProduct?.price||0)*(Number(checkoutItem?.quantity)||1)}
function safeText(v){return String(v??"").replace(/[&<>"\x27]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","\x27":"&#39;"}[c]))}
function renderSummary(){if(!checkoutItem||!checkoutProduct)return;const ship=shippingFee(shipping.value),total=Math.max(subtotal()+ship-activeDiscount,0),qty=Number(checkoutItem.quantity)||1;summary.innerHTML=`${PMShop.badge(checkoutProduct)}<p><b>${safeText(checkoutProduct.name)}</b></p><p>${safeText(checkoutProduct.shop)} | Stok ${checkoutProduct.stock} | Kuantiti ${qty}</p><p>Item: <b>${money(subtotal())}</b></p><p>Penghantaran: <b>${Number.isFinite(ship)?money(window.pmDeliveryCourierFee()):"Dapatkan sebut harga"}</b></p><p>Fi pentadbiran logistik PasarMalam: <b>${Number.isFinite(ship)?money(window.pmDeliveryAdminFee()):"-"}</b></p><p>Diskaun voucher: <b>${money(activeDiscount)}</b>${activeVoucher?` (${safeText(activeVoucher)})`:""}</p><p class="total">Jumlah: ${Number.isFinite(ship)?money(total):"-"}</p>`}
async function applyVoucher(){try{activeVoucher=voucher.value.trim();activeDiscount=0;if(!activeVoucher){voucherStatus.textContent="Tiada voucher digunakan.";renderSummary();return}const campaigns=(await api("/api/campaigns")).campaigns||[];const c=campaigns.find(x=>String(x.name||"").toLowerCase()===activeVoucher.toLowerCase()&&x.status==="active"&&String(x.seller_id)===String(checkoutProduct?.seller_id));if(!c)throw new Error("Voucher tidak ditemui atau tidak aktif.");if(!["voucher","flash_sale","bundle_deal","free_shipping"].includes(c.type))throw new Error("Promosi ini tidak boleh digunakan semasa bayaran.");if(c.type==="free_shipping"){activeDiscount=0;voucherStatus.textContent="Promosi penghantaran percuma direkodkan. Caj penghantaran masih ikut peraturan platform buat masa ini."}else{const match=String(c.value||"").trim().match(/^(?:RM\s*)?(\d+(?:\.\d{1,2})?)\s*(%)?\s*(?:off)?(?:\s+(?:above|over|minimum|min)\s*(?:RM\s*)?(\d+(?:\.\d{1,2})?))?$/i);if(!match||Number(match[1])<=0||(match[2]&&Number(match[1])>100))throw new Error("Voucher value is invalid. Please contact the seller");if(subtotal()<Number(match[3]||0))throw new Error("Minimum purchase for this voucher is RM"+Number(match[3]).toFixed(2));activeDiscount=Math.round(Math.min(match[2]?subtotal()*Number(match[1])/100:Number(match[1]),subtotal())*100)/100}voucherStatus.textContent=`Voucher digunakan: ${activeVoucher} jimat ${money(activeDiscount)}.`;renderSummary()}catch(e){activeVoucher="";activeDiscount=0;voucherStatus.textContent=e.message;renderSummary()}}
function requireCheckoutReady(){const u=currentUser();if(!token()||u.role!=="buyer")throw new Error("Sila log masuk sebagai pembeli sebelum bayar.");if(!checkoutItem||!checkoutProduct)throw new Error("Tiada produk dipilih untuk bayaran.");if(PMShop.closed(checkoutProduct))throw new Error(PMShop.message());if(!address.value.trim())throw new Error("Alamat penghantaran diperlukan.");if(!buyerPhone.value.trim())throw new Error("Nombor telefon diperlukan.");if(!payment.value)throw new Error("Kaedah bayaran diperlukan.");if(Number(checkoutItem.quantity)<1)throw new Error("Kuantiti mesti sekurang-kurangnya 1.");if(Number(checkoutProduct.stock||0)<1)throw new Error("Stok habis. Produk ini tidak boleh dibayar.");if(Number(checkoutItem.quantity)>Number(checkoutProduct.stock||0))throw new Error(`Hanya ${checkoutProduct.stock} item tersedia.`)}
async function loadSummary(){const u=currentUser();if(!token()||u.role!=="buyer"){summary.innerHTML="<p class='error'>Sila log masuk sebagai pembeli sebelum bayar.</p><button class='primary' onclick=\"location.href='login.html'\">Log Masuk</button>";pay.disabled=true;return}buyerEmail.value=u.email||"";buyerPhone.value=u.phone||"";address.value=u.address||"";const params=new URLSearchParams(location.search);const productId=params.get("product_id");const urlQty=Math.max(1,Number(params.get("quantity")||1));const urlVariant=params.get("variant")||"";const products=(await api("/api/products")).products;const cart=(await api("/api/cart")).cart;if(productId){checkoutProduct=products.find(p=>String(p.id)===String(productId));checkoutItem={product_id:Number(productId),quantity:urlQty,variant:urlVariant};}else{if(cart.length>1){summary.innerHTML='<p>Please select an item in your cart before checkout.</p><a href="cart.html">Choose item</a>';pay.disabled=true;return}checkoutItem=cart[0];checkoutProduct=checkoutItem?products.find(p=>String(p.id)===String(checkoutItem.product_id)):null}if(!checkoutItem||!checkoutProduct){summary.innerHTML="<p class='error'>Tiada produk dalam troli. Tambah item sebelum bayar.</p>";pay.disabled=true;return}renderSummary()}
pay.onclick=async()=>{try{pay.disabled=true;pay.textContent="Menyemak pesanan...";requireCheckoutReady();pay.textContent="Mencipta bayaran selamat...";const payload={product_id:Number(checkoutItem.product_id),quantity:Number(checkoutItem.quantity)||1,variant:checkoutItem.variant||"",buyer_email:buyerEmail.value.trim(),buyer_phone:buyerPhone.value.trim(),address:address.value.trim(),logistics_method:shipping.value,logistics_fee:shippingFee(shipping.value),payment_method:payment.value,voucher_code:activeVoucher};if(["Cash Pickup","Pay on Arrival"].includes(payment.value)){const o=await api("/api/checkout",{method:"POST",body:JSON.stringify({...payload,payment_status:"unpaid",order_status:"pending_payment",escrow_status:"pending"})});localStorage.setItem("pm_last_checkout",JSON.stringify({order_id:o.id,total:o.total,payment_method:payment.value,created_at:Date.now()}));result.innerHTML=`<h3 class="ok">${payment.value==="Pay on Arrival"?"PM Express: Bayar semasa tiba / Pay on Arrival":"Pesanan tunai semasa ambil dibuat"}</h3><p>Pesanan PM-${o.id}</p><p>Status: ${o.payment_status}</p><p>Jumlah: ${money(o.total)}${o.discount?` | Voucher jimat ${money(o.discount)}`:""}</p><button class="primary" onclick="location.href='order-confirmation.html?id=${o.id}'">Lihat Pengesahan</button>`;return}const o=await api("/api/payments/billplz/create",{method:"POST",body:JSON.stringify(payload)});if(o.checkout_url){localStorage.setItem("pm_last_checkout",JSON.stringify({order_id:o.order_id,bill_code:o.bill_code,total:o.total,discount:o.discount||0,payment_method:payment.value,created_at:Date.now()}));location.href=o.checkout_url;return}showError(o.message||"Gerbang bayaran belum sedia.")}catch(err){showError(err.message)}finally{pay.disabled=false;pay.textContent=window.pmCheckoutButtonLabel?window.pmCheckoutButtonLabel():"Bayar Sekarang"}};
const loadBaseSummary=loadSummary;
loadSummary=async()=>{await loadBaseSummary();window.dispatchEvent(new Event('pm-checkout-loaded'));};
loadSummary().catch(e=>showError(e.message));
</script><script src="checkout-delivery.js?v=simple2"></script><script src="checkout-address.js?v=simple2"></script><script src="checkout-branches.js?v=simple2"></script><script src="badges.js?v=shopping1"></script><script src="buyer-ui.js?v=3"></script><link rel="stylesheet" href="checkout.css?v=4"></body></html>
