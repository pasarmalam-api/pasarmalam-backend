<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PasarMalam Seller Store</title><script src="shop-status.js?v=1"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#202830;font:14px Arial,sans-serif}
header,main{max-width:1000px;margin:auto;padding:16px}header{display:flex;align-items:center;gap:20px;border-bottom:1px solid #d9e3e0}
a{color:#167343}h1{font-size:22px}h2{font-size:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
article{background:white;border:1px solid #d9e3e0;border-radius:8px;overflow:hidden}article a{display:block;padding:12px;text-decoration:none;color:inherit}
img{width:100%;aspect-ratio:1;object-fit:contain}p,h2{overflow-wrap:anywhere}.price{color:#167343;font-weight:bold}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style><link rel="icon" type="image/png" href="pasarmalam-logo.png"><link rel="stylesheet" href="buyer-ui.css?v=3"></head>
<body class="buyer-page"><header><div class="bar"><div class="brand"><a class="logo" href="index.html"><img src="pasarmalam-logo.png" width="56" height="56" alt="PasarMalam"></a><div><h2>PasarMalam</h2><div>Seller Store</div></div></div><a class="soft" href="index.html">Home</a><a class="soft" href="cart.html">Cart</a></div></header>
<main><h1 id="shopName">Kedai penjual</h1><div id="shopStatus" role="status"></div><div id="items" class="grid"></div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
 const id=new URLSearchParams(location.search).get('seller_id');
 if(!id){shopStatus.textContent='Pilih kedai dari halaman produk.';return}
 const res=await fetch('https://pasarmalam-backend.onrender.com/api/products');
 if(!res.ok)throw new Error('Gagal memuatkan kedai.');
 const rows=(await res.json()).products.filter(p=>String(p.seller_id)===id);
 if(!rows.length){shopStatus.textContent='Tiada produk tersedia.';return}
 shopName.textContent=rows[0].shop;
 shopStatus.innerHTML=PMShop.badge(rows.find(p=>/^(food|street food|meals|drinks)$/i.test(p.category))||rows[0]);
 items.innerHTML=rows.map(p=>`<article><a href="product.html?id=${Number(p.id)}">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:''}<h2>${esc(p.name)}</h2><p class="price">RM${Number(p.price).toFixed(2)}</p>${PMShop.badge(p)}</a></article>`).join('');
}
load().catch(e=>shopStatus.textContent=e.message);
window.addEventListener('focus',()=>load().catch(()=>{}));
</script><script src="badges.js?v=shopping1"></script><script src="buyer-ui.js?v=3"></script></body></html>
