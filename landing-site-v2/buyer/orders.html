<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PasarMalam Orders</title>
  <style>:root{--brand:#0f9f8f;--purple:#6d5dfc;--pink:#e43f8f;--line:#e6e9ef;--muted:#687282;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);overflow-x:hidden}header{background:linear-gradient(180deg,var(--brand),var(--purple));color:#fff;position:relative;z-index:50}.bar,main{max-width:1000px;margin:auto}main{padding-bottom:150px}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px}.brand{display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}.brand h2{margin:0;font-size:22px}.logo{width:50px;height:50px;border-radius:13px;background:conic-gradient(from 160deg,var(--brand),var(--purple),var(--pink),var(--brand));display:grid;place-items:center;font-weight:900;box-shadow:inset 0 0 0 3px #ffffffcc;flex:0 0 auto}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;margin:16px;padding:14px;overflow:hidden}.order{border-bottom:1px solid var(--line);padding:12px 0;position:relative;z-index:1;overflow:hidden;overflow-wrap:anywhere}.tag{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;background:#eafaf2;color:#067647}.muted{color:var(--muted);font-size:13px;line-height:1.4}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.soft{background:#fff;color:var(--brand);border:1px solid #b8fff5;border-radius:6px;min-height:38px;padding:0 14px;font-weight:900;white-space:normal;cursor:pointer}@media(max-width:700px){.bar{display:grid;grid-template-columns:1fr;align-items:start}.bar>.soft{justify-self:start}.panel{margin:10px 8px;padding:12px}.brand h2{font-size:18px}.order{padding:10px 0}.actions{display:grid;grid-template-columns:1fr 1fr}.soft{min-width:0;font-size:12px;padding:0 8px}}</style>
</head>
<body><header><div class="bar"><div class="brand" onclick="location.href='index.html'"><div class="logo">PM</div><div><h2>PasarMalam</h2><div>Pesanan</div></div></div><button class="soft" onclick="location.href='notifications.html'">Notifikasi</button> <button class="soft" onclick="location.href='index.html'">Laman Utama</button></div></header><main><section class="panel"><h2>Penjejakan Pesanan</h2><div id="orders">Memuatkan...</div></section></main><script>
const API_BASE="https://pasarmalam-backend.onrender.com";
function authToken(){return localStorage.getItem("pm_token")||""}
function remain(ts){if(!ts)return "-";const s=Number(ts)-Math.floor(Date.now()/1000);if(s<=0)return "Tamat tempoh";return `${Math.floor(s/86400)}h ${Math.floor((s%86400)/3600)}j`}
function escrowLabel(s){return {holding:"Ditahan",released:"Dilepaskan",dispute_hold:"Ditahan untuk pertikaian",refund_approved:"Bayaran balik diluluskan",refund_rejected:"Bayaran balik ditolak",refunded:"Dibayar balik",cancelled:"Dibatalkan",pending:"Belum selesai"}[s]||s||"-"}
function paymentLabel(s){return {paid:"Dibayar",unpaid:"Belum dibayar",pending_payment:"Bayaran belum selesai",failed:"Gagal",rejected:"Ditolak"}[s]||s||"-"}
function orderLabel(s){return {pending_payment:"Bayaran belum selesai",placed:"Dibuat",paid:"Dibayar",packed:"Dibungkus",shipped:"Dihantar",delivered:"Diterima",completed:"Selesai",cancelled:"Dibatalkan",refunded:"Dibayar balik"}[s]||s||"-"}
function sampleOrder(o){const text=`${o.id} ${o.product_name||""} ${o.buyer_name||""} ${o.reason||""} ${o.payment_review_note||""} ${o.tracking_no||""}`;return Number(o.id)<=45||/test|demo|cloudinary|postgres|auth seller|automated|buyer bad|seller test|bad product|should-fail|notification/i.test(text)}
function signedOut(){orders.innerHTML="<p class='muted'>Sila log masuk untuk melihat pesanan anda.</p><button class='soft' onclick=\"location.href='login.html'\">Log Masuk</button>"}
async function load(){const token=authToken();if(!token){signedOut();return}const r=await fetch(API_BASE+"/api/orders",{headers:{Authorization:`Bearer ${token}`}});const data=await r.json();const rows=(data.orders||[]).filter(o=>!sampleOrder(o));orders.innerHTML=rows.length?rows.map(o=>{const refunded=o.escrow_status==="refunded",cancelled=o.order_status==="cancelled"||o.escrow_status==="cancelled";return `<div class="order"><b>PM-${o.id}</b> <span class="tag">${refunded?"Dibayar balik":cancelled?"Dibatalkan":orderLabel(o.order_status)}</span><p>${paymentLabel(o.payment_status)} | Escrow ${escrowLabel(o.escrow_status)}</p>${refunded?'<p class="muted"><b>Bayaran balik selesai.</b> Bayaran penjual kekal ditahan untuk pesanan ini.</p>':""}${cancelled?`<p class="muted"><b>Bayaran tamat tempoh/dibatalkan.</b> ${o.payment_review_note||"Pesanan ini dibatalkan kerana bayaran tidak lengkap."}</p>`:""}<p class="muted">${o.logistics_method||"Penghantaran"} | Penjejakan ${o.tracking_no||"-"}</p><p class="muted">Tarikh akhir pulangan: ${remain(o.return_deadline_at)} | Pelepasan escrow: ${remain(o.escrow_release_at)}</p><div class="actions"><button class="soft" onclick="location.href='order-detail.html?id=${o.id}'">Lihat Butiran</button><button class="soft" onclick="location.href='order-confirmation.html?id=${o.id}'">Pengesahan</button><button class="soft" onclick="location.href='receipt.html?id=${o.id}'">Resit</button>${cancelled?"":`<button class="soft" onclick="location.href='returns.html?order_id=${o.id}'">Pulangan / Bayaran Balik</button>`}</div></div>`}).join(""):"<p class='muted'>Belum ada pesanan.</p>"}
load();
</script><script src="badges.js"></script></body></html>
