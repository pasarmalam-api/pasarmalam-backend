<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PasarMalam Cart</title>
  <style>:root{--brand:#0f9f8f;--purple:#6d5dfc;--pink:#e43f8f;--line:#e6e9ef;--muted:#687282;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg)}header{background:linear-gradient(180deg,var(--brand),var(--purple));color:#fff}.bar,main{max-width:1000px;margin:auto}main{padding-bottom:150px}.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}.brand{display:flex;gap:10px;align-items:center;cursor:pointer}.logo{width:50px;height:50px;border-radius:13px;background:conic-gradient(from 160deg,var(--brand),var(--purple),var(--pink),var(--brand));display:grid;place-items:center;font-weight:900;box-shadow:inset 0 0 0 3px #ffffffcc}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;margin:16px;padding:14px}.line{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid var(--line);padding:12px 0}.muted{color:var(--muted);font-size:13px}.primary,.soft,.danger,.step{border-radius:6px;min-height:38px;padding:0 14px;font-weight:900;cursor:pointer}.primary{border:0;background:var(--brand);color:#fff}.soft,.step{background:#fff;color:var(--brand);border:1px solid #b8fff5}.danger{background:#fff0f3;color:#be123c;border:1px solid #fecdd3}.price{color:var(--brand);font-weight:900}.qty{display:flex;gap:6px;align-items:center;justify-content:flex-end}.qty b{min-width:28px;text-align:center}.error{color:#be123c;font-weight:900}@media(max-width:700px){.line{grid-template-columns:1fr}.qty{justify-content:flex-start}}</style>
</head>
<body><header><div class="bar"><div class="brand" onclick="location.href='index.html'"><div class="logo">PM</div><div><h2>PasarMalam</h2><div>Troli</div></div></div><button class="soft" onclick="location.href='index.html'">Laman Utama</button></div></header><main><section class="panel"><h2>Troli Anda</h2><div class="line"><div><b>Voucher Platform</b><div class="muted">RM5 diskaun untuk belian melebihi RM50, digunakan jika layak.</div></div><button class="soft">Guna Voucher</button></div><div class="line"><div><b>Syiling PM</b><div class="muted">Dapat syiling selepas pesanan selesai.</div></div><span class="price">+25 syiling</span></div><div id="cartList">Memuatkan...</div><h3 id="total"></h3><p id="status" class="muted"></p><button class="primary" id="checkoutBtn" onclick="goCheckout()">Bayar</button></section></main><script>
const API_BASE="https://pasarmalam-backend.onrender.com";let cart=[];const money=v=>`RM${Number(v||0).toFixed(2)}`;function token(){return localStorage.getItem("pm_token")||""}async function api(path,options={}){const headers={"Content-Type":"application/json",...(options.headers||{})};if(token())headers.Authorization=`Bearer ${token()}`;const r=await fetch(API_BASE+path,{...options,headers});const d=await r.json().catch(async()=>({error:await r.text()}));if(!r.ok||d.error)throw new Error(d.error||"Request failed");return d}function signedOut(){cart=[];cartList.innerHTML="<p class='muted'>Sila log masuk untuk melihat troli anda.</p><button class='soft' onclick=\"location.href='login.html'\">Log Masuk</button>";total.textContent="";status.textContent=""}function draw(){const unavailable=cart.filter(i=>Number(i.stock||0)<1);const available=cart.filter(i=>Number(i.stock||0)>0);let sum=0;const warning=unavailable.length?`<div class="line"><div><b class="error">Stok habis</b><div class="muted">${unavailable.map(i=>i.name).join(", ")} tidak boleh dibayar. Buang item ini sebelum bayar.</div></div></div>`:"";cartList.innerHTML=cart.length?warning+cart.map(i=>{const itemAvailable=Number(i.stock||0)>0;if(itemAvailable)sum+=Number(i.price)*Number(i.quantity);return `<div class="line"><div><b>${i.name}</b><div class="muted">${i.shop} | ${i.category||""} | ${itemAvailable?`Stok ${i.stock}`:"Stok habis"} ${i.variant||""}</div><div class="muted">Unit ${money(i.price)} | Subtotal <b>${money(Number(i.price)*Number(i.quantity))}</b></div></div><div><div class="qty"><button class="step" onclick="changeQty(${i.id},${i.quantity-1})" ${itemAvailable?"":"disabled"}>-</button><b>${i.quantity}</b><button class="step" onclick="changeQty(${i.id},${i.quantity+1})" ${itemAvailable?"":"disabled"}>+</button></div><button class="danger" onclick="removeItem(${i.id})">Buang</button></div></div>`}).join(""):"<p class='muted'>Troli kosong.</p>";total.textContent=available.length?"Jumlah: "+money(sum):"";if(window.checkoutBtn)checkoutBtn.disabled=!available.length||unavailable.length>0}async function load(){if(!token()){signedOut();return}try{const data=await api("/api/cart");cart=data.cart||[];draw()}catch(e){status.textContent=e.message;cartList.innerHTML="<p class='error'>Sila log masuk untuk melihat troli.</p>"}}async function changeQty(id,quantity){try{if(!token()){signedOut();return}const item=cart.find(i=>i.id===id);if(!item)return;if(quantity<1){status.textContent="Kuantiti tidak boleh kurang daripada 1.";return}if(quantity>Number(item.stock||0)){status.textContent=`Hanya ${item.stock} item tersedia.`;return}await api("/api/cart",{method:"PUT",body:JSON.stringify({id,product_id:item.product_id,quantity,variant:item.variant||""})});status.textContent="Troli dikemas kini.";await load()}catch(e){status.textContent=e.message}}async function removeItem(id){try{if(!token()){signedOut();return}await api("/api/cart",{method:"DELETE",body:JSON.stringify({id})});status.textContent="Item dibuang.";await load()}catch(e){status.textContent=e.message}}function goCheckout(){if(!token()){signedOut();return}if(!cart.length){status.textContent="Troli kosong.";return}if(cart.some(i=>Number(i.stock||0)<1)){status.textContent="Buang item stok habis sebelum bayar.";return}location.href="checkout.html"}load();
</script><script src="badges.js"></script></body></html>
