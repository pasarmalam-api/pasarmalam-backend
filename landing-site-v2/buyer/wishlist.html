<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PasarMalam Wishlist</title><style>:root{--brand:#0f9f8f;--purple:#6d5dfc;--pink:#e43f8f;--line:#e6e9ef;--muted:#687282;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg)}header{background:linear-gradient(180deg,var(--brand),var(--purple));color:#fff}.bar,main{max-width:900px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}.logo{width:50px;height:50px;border-radius:13px;background:conic-gradient(from 160deg,var(--brand),var(--purple),var(--pink),var(--brand));display:grid;place-items:center;font-weight:900;box-shadow:inset 0 0 0 3px #ffffffcc}.brand{display:flex;gap:10px;align-items:center;cursor:pointer}.panel,.item{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin:16px}.item{margin:8px 0}.soft{background:#fff;color:var(--brand);border:1px solid #b8fff5;border-radius:6px;min-height:38px;padding:0 14px;font-weight:900}.muted{color:var(--muted)}</style><link rel="icon" type="image/png" href="pasarmalam-logo.png"><link rel="stylesheet" href="buyer-ui.css?v=1"></head><body class="buyer-page"><header><div class="bar"><div class="brand" onclick="location.href='index.html'"><a class="logo" href="index.html" title="Home"><img src="pasarmalam-logo.png" width="56" height="56" alt="PasarMalam"></a><div><h2>PasarMalam</h2><div>Wishlist</div></div></div><button class="soft" onclick="location.href='index.html'">Home</button></div></header><main><section class="panel"><h2>Wishlist / Favorites</h2><div id="list">Loading...</div></section></main><script>const API="https://pasarmalam-backend.onrender.com";
const list=document.getElementById('list');
function esc(v){const e=document.createElement('span');e.textContent=v??'';return e.innerHTML}
async function request(path,options={}){const token=localStorage.getItem('pm_token');if(!token)throw new Error('Please sign in to view your wishlist.');const r=await fetch(API+path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function load(){try{const w=(await request('/api/wishlist')).wishlist||[],p=(await request('/api/products')).products||[];list.innerHTML=w.length?w.map(i=>{const prod=p.find(x=>x.id===i.product_id),id=Number(i.product_id);return '<div class="item"><b>'+esc(prod?prod.name:'Unavailable product')+'</b><p><a class="soft" href="product.html?id='+id+'">View</a> <button class="soft" onclick="removeSaved('+id+')">Remove</button></p></div>'}).join(''):'No wishlist items yet.'}catch(e){list.textContent=e.message;if(!localStorage.getItem('pm_token')){const a=document.createElement('a');a.href='login.html?next=wishlist.html';a.textContent=' Sign In';list.appendChild(a)}}}
async function removeSaved(id){try{await request('/api/wishlist',{method:'DELETE',body:JSON.stringify({product_id:id})});await load()}catch(e){list.textContent=e.message}}
load();</script><script src="badges.js?v=buyer-actions-2"></script><script src="buyer-ui.js?v=2"></script></body></html>
