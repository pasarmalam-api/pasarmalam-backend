<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PasarMalam Sign In</title>
  <style>
    :root{--brand:#0f9f8f;--purple:#5a54d6;--pink:#d93682;--ink:#182230;--muted:#667085;--line:#e4e7ec;--bg:#f6f8fb;--panel:#fff}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}a{color:var(--brand);font-weight:800;text-decoration:none}
    header{background:#fff;border-bottom:1px solid var(--line)}.bar,.shell{max-width:1120px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border-radius:12px;background:conic-gradient(from 160deg,var(--brand),var(--purple),var(--pink),var(--brand));display:grid;place-items:center;color:#fff;font-weight:900;font-size:21px;box-shadow:inset 0 0 0 3px #ffffffcc}.brand h1{font-size:22px;margin:0}.brand span{display:block;color:var(--muted);font-size:12px;font-weight:800}
    .shell{min-height:calc(100vh - 77px);display:grid;grid-template-columns:1.05fr 440px;gap:22px;align-items:center;padding:26px 18px}.visual{min-height:580px;border-radius:8px;background:linear-gradient(90deg,#101828e6,#10182888,#10182822),url("pasar-malam-real.jpg") center/cover;color:#fff;display:flex;align-items:flex-end;padding:32px}.visual h2{font-size:42px;line-height:1.05;margin:0 0 10px;max-width:660px}.visual p{margin:0;max-width:560px;line-height:1.55;color:#eef4ff}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px;box-shadow:0 16px 40px #18223012}.card h2{margin:0 0 6px;font-size:28px}.muted{color:var(--muted);font-size:14px;line-height:1.45}.mode{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin:18px 0}.mode a{min-height:42px;display:grid;place-items:center;color:var(--muted);background:#fff}.mode a.active{background:#effdfa;color:var(--brand)}
    label{display:block;font-size:13px;font-weight:900;margin:14px 0 6px}input{width:100%;border:1px solid var(--line);border-radius:6px;padding:13px;background:#fff}.field{display:grid;grid-template-columns:1fr auto;gap:8px}.primary,.outline{border-radius:6px;min-height:44px;padding:0 14px;font-weight:900}.primary{width:100%;border:0;background:linear-gradient(90deg,var(--brand),var(--purple));color:#fff;margin-top:16px}.outline{border:1px solid var(--line);background:#fff;color:var(--brand)}.help{display:flex;justify-content:space-between;gap:10px;margin-top:12px}.status{min-height:22px;margin-top:12px}.success{border:1px solid #b8fff5;background:#effdfa;color:#067a6f;border-radius:6px;padding:10px}.error{border:1px solid #fecaca;background:#fff1f2;color:#b42318;border-radius:6px;padding:10px}
    @media(max-width:860px){.shell{grid-template-columns:1fr}.visual{min-height:260px}.visual h2{font-size:31px}}@media(max-width:520px){.bar{align-items:flex-start}.help{display:block}.shell{padding:16px 12px}.card{padding:18px}.visual{padding:22px}}
  </style>
<link rel="icon" type="image/png" href="pasarmalam-logo.png"><link rel="stylesheet" href="buyer-ui.css?v=3"></head>
<body class="buyer-page buyer-auth">
<header><div class="bar"><div class="brand" onclick="location.href='index.html'"><a class="logo" href="index.html" title="Home"><img src="pasarmalam-logo.png" width="56" height="56" alt="PasarMalam"></a><div><h1>PasarMalam</h1><span>Aplikasi Pembeli</span></div></div><button class="outline" onclick="location.href='index.html'">Home</button></div></header>
<main class="shell">
  <section class="card">
    <h2>Sign In</h2>
    <div class="mode"><a class="active" href="login.html">Sign In</a><a href="signup.html">Sign Up</a></div>
    <label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com">
    <label for="password">Password</label><div class="field"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button class="outline" onclick="togglePassword()" type="button" id="viewBtn">View</button></div>
    <button class="primary" onclick="login()">Sign In</button>
    <div class="help"><span class="muted">No account? <a href="signup.html">Create one</a></span><a href="password-reset.html">Forgot password?</a></div>
    <div id="status" class="status muted" role="status" aria-live="polite">Not signed in.</div>
  </section>
</main>
<script>
const API="https://pasarmalam-backend.onrender.com";
const $=id=>document.getElementById(id);
function setStatus(text,type="muted"){const el=$("status");el.className="status "+type;el.textContent=text}
function togglePassword(){const password=$("password"),viewBtn=$("viewBtn");password.type=password.type==="password"?"text":"password";viewBtn.textContent=password.type==="password"?"View":"Hide"}
async function login(){
  const email=$("email"),password=$("password");
  setStatus("Signing in...");
  if(!email.value.trim()||!password.value){setStatus("Email and password are required.","error");return}
  if(login.busy)return;login.busy=true;
  try{
  const r=await fetch(API+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({role:'buyer',email:email.value.trim().toLowerCase(),password:password.value})});
  const d=await r.json().catch(()=>({}));
  if(r.ok&&d.token&&d.user?.role==='buyer'){localStorage.setItem("pm_token",d.token);localStorage.setItem("pm_user",JSON.stringify(d.user));setStatus("Signed in. Redirecting...","success");const next=new URLSearchParams(location.search).get('next')||'index.html';setTimeout(()=>location.href=/^[a-z-]+\.html(?:\?[^#]*)?$/.test(next)?next:'index.html',650)}
  else if(d.user&&d.user.role!=='buyer'){setStatus('Please use a buyer account. Seller sign-in is available through Switch to Seller.','error')}
  else{setStatus(d.error||"Sign in failed.","error")}
  }catch(e){setStatus('Connection failed. Please try again.','error')}finally{login.busy=false}
}
document.addEventListener("DOMContentLoaded",()=>$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()}));
</script>
<script src="badges.js?v=shopping1"></script><script src="buyer-ui.js?v=3"></script></body>
</html>
