<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PasarMalam Sign Up</title>
  <style>
    :root{--brand:#0f9f8f;--purple:#5a54d6;--pink:#d93682;--ink:#182230;--muted:#667085;--line:#e4e7ec;--bg:#f6f8fb;--panel:#fff}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}a{color:var(--brand);font-weight:800;text-decoration:none}
    header{background:#fff;border-bottom:1px solid var(--line)}.bar,.shell{max-width:1120px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border-radius:12px;background:conic-gradient(from 160deg,var(--brand),var(--purple),var(--pink),var(--brand));display:grid;place-items:center;color:#fff;font-weight:900;font-size:21px;box-shadow:inset 0 0 0 3px #ffffffcc}.brand h1{font-size:22px;margin:0}.brand span{display:block;color:var(--muted);font-size:12px;font-weight:800}
    .shell{min-height:calc(100vh - 77px);display:grid;grid-template-columns:1.05fr 460px;gap:22px;align-items:center;padding:26px 18px}.visual{min-height:620px;border-radius:8px;background:linear-gradient(90deg,#101828e6,#10182888,#10182822),url("pasar-malam-real.jpg") center/cover;color:#fff;display:flex;align-items:flex-end;padding:32px}.visual h2{font-size:42px;line-height:1.05;margin:0 0 10px;max-width:660px}.visual p{margin:0;max-width:580px;line-height:1.55;color:#eef4ff}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px;box-shadow:0 16px 40px #18223012}.card h2{margin:0 0 6px;font-size:28px}.muted{color:var(--muted);font-size:14px;line-height:1.45}.mode{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin:18px 0}.mode a{min-height:42px;display:grid;place-items:center;color:var(--muted);background:#fff}.mode a.active{background:#effdfa;color:var(--brand)}
    label{display:block;font-size:13px;font-weight:900;margin:12px 0 6px}input,textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:12px;background:#fff}textarea{min-height:74px;resize:vertical}.field{display:grid;grid-template-columns:1fr auto;gap:8px}.primary,.outline{border-radius:6px;min-height:44px;padding:0 14px;font-weight:900}.primary{width:100%;border:0;background:linear-gradient(90deg,var(--brand),var(--purple));color:#fff;margin-top:14px}.outline{border:1px solid var(--line);background:#fff;color:var(--brand)}.terms{display:flex;gap:8px;align-items:flex-start;margin:12px 0}.terms input{width:auto;margin-top:2px}.status{min-height:22px;margin-top:12px}.success{border:1px solid #b8fff5;background:#effdfa;color:#067a6f;border-radius:6px;padding:10px}.error{border:1px solid #fecaca;background:#fff1f2;color:#b42318;border-radius:6px;padding:10px}.note{background:#f9fafb;border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:12px}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.visual{min-height:260px}.visual h2{font-size:31px}}@media(max-width:520px){.shell{padding:16px 12px}.card{padding:18px}.visual{padding:22px}.field{grid-template-columns:1fr}.bar{align-items:flex-start}}
  </style>
<link rel="icon" type="image/png" href="pasarmalam-logo.png"><link rel="stylesheet" href="buyer-ui.css?v=1"></head>
<body class="buyer-page buyer-auth">
<header><div class="bar"><div class="brand" onclick="location.href='index.html'"><a class="logo" href="index.html" title="Home"><img src="pasarmalam-logo.png" width="56" height="56" alt="PasarMalam"></a><div><h1>PasarMalam</h1><span>Aplikasi Pembeli</span></div></div><button class="outline" onclick="location.href='login.html'">Sign In</button></div></header>
<main class="shell">
  <section class="card">
    <h2>Create Account</h2>
    <div class="mode"><a href="login.html">Sign In</a><a class="active" href="signup.html">Sign Up</a></div>
    <label for="name">Full name</label><input id="name" autocomplete="name" placeholder="Your full name">
    <label for="phone">Phone number</label><input id="phone" autocomplete="tel" inputmode="tel" placeholder="+60">
    <label for="email">Email</label><div class="field"><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><button class="outline" onclick="sendEmailOtp()" type="button">Send OTP</button></div>
    <label for="otp">Email verification code</label><div class="field"><input id="otp" autocomplete="one-time-code" inputmode="numeric" maxlength="6" placeholder="6-digit code"><button class="outline" onclick="verifyEmailOtp()" type="button">Verify</button></div>
    <label for="password">Password</label><div class="field"><input id="password" type="password" autocomplete="new-password" placeholder="Minimum 8 characters"><button class="outline" onclick="togglePassword()" type="button" id="viewBtn">View</button></div>
    <label for="address">Delivery address</label><textarea id="address" autocomplete="street-address" placeholder="House, street, city, postcode"></textarea>
    <label class="terms"><input id="agree" type="checkbox"><span>I agree to PasarMalam <a href="policies.html" target="_blank">Terms, Privacy Policy, Buyer Protection, Return/Refund Policy, and Marketplace Rules</a>.</span></label>
    <button class="primary" onclick="signup()">Create Account</button>
    <div id="status" class="status muted" role="status" aria-live="polite"></div>
  </section>
</main>
<script>
const API="https://pasarmalam-backend.onrender.com";
let emailOtpToken="";
const $=id=>document.getElementById(id);
function setStatus(text,type="muted"){const el=$("status");el.className="status "+type;el.textContent=text}
function togglePassword(){const password=$("password"),viewBtn=$("viewBtn");password.type=password.type==="password"?"text":"password";viewBtn.textContent=password.type==="password"?"View":"Hide"}
async function post(path,body){const r=await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Request failed");return d}
async function sendEmailOtp(){
  try{const email=$("email");if(!email.value.trim()){setStatus("Email is required.","error");return}setStatus("Sending OTP...");const d=await post("/api/otp/email/send",{email:email.value.trim(),purpose:"buyer_signup"});setStatus(d.message||"OTP sent to email.","success")}
  catch(e){setStatus(e.message,"error")}
}
async function verifyEmailOtp(){
  try{const email=$("email"),otp=$("otp");if(!otp.value.trim()){setStatus("OTP code is required.","error");return}setStatus("Verifying OTP...");const d=await post("/api/otp/email/verify",{email:email.value.trim(),code:otp.value.trim(),purpose:"buyer_signup"});emailOtpToken=d.email_otp_token;setStatus("Email verified. You can create account now.","success")}
  catch(e){setStatus(e.message,"error")}
}
async function signup(){
  const name=$("name"),phone=$("phone"),email=$("email"),password=$("password"),address=$("address"),agree=$("agree");
  if(!name.value.trim()){setStatus("Full name is required.","error");return}
  if(!phone.value.trim()){setStatus("Phone number is required.","error");return}
  if(!email.value.trim()){setStatus("Email is required.","error");return}
  if(!emailOtpToken){setStatus("Please verify your email OTP first.","error");return}
  if(password.value.length<8){setStatus("Password must be at least 8 characters.","error");return}
  if(!agree.checked){setStatus("Please accept the terms first.","error");return}
  setStatus("Creating account...");
  if(signup.busy)return;signup.busy=true;
  try{
  const r=await fetch(API+"/api/auth/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value.trim(),email:email.value.trim(),password:password.value,phone:phone.value.trim(),address:address.value.trim(),role:"buyer",email_otp_token:emailOtpToken})});
  const d=await r.json().catch(()=>({}));
  if(d.token){localStorage.setItem("pm_token",d.token);localStorage.setItem("pm_user",JSON.stringify(d.user));setStatus("Account created. Redirecting...","success");setTimeout(()=>location.href="index.html",800)}
  else setStatus(d.error||"Signup failed.","error");
  }catch(e){setStatus('Connection failed. Please try again.','error')}finally{signup.busy=false}
}
document.getElementById('email').addEventListener('input',()=>{emailOtpToken=''});
</script>
<script src="badges.js?v=buyer-actions-2"></script><script src="buyer-ui.js?v=2"></script></body>
</html>
