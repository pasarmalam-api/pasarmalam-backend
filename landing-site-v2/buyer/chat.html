<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PasarMalam Chat</title><style>:root{--brand:#0f9f8f;--purple:#6d5dfc;--pink:#e43f8f;--line:#e6e9ef;--muted:#687282;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg)}input{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px}header{background:linear-gradient(180deg,var(--brand),var(--purple));color:#fff}.bar,main{max-width:900px;margin:auto}main{padding-bottom:150px}.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}.brand{display:flex;gap:10px;align-items:center;cursor:pointer}.logo{width:50px;height:50px;border-radius:13px;background:conic-gradient(from 160deg,var(--brand),var(--purple),var(--pink),var(--brand));display:grid;place-items:center;font-weight:900;box-shadow:inset 0 0 0 3px #ffffffcc}.panel,.msg{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin:16px}.msg{margin:8px 0}.me{background:#f0fffc;margin-left:30px}.row{display:grid;grid-template-columns:1fr auto;gap:8px}.primary,.soft{border:0;border-radius:6px;min-height:38px;padding:0 14px;font-weight:900}.primary{background:var(--brand);color:#fff}.soft{background:#fff;color:var(--brand);border:1px solid #b8fff5}.muted{color:var(--muted)}</style><link rel="icon" type="image/png" href="pasarmalam-logo.png"><link rel="stylesheet" href="buyer-ui.css?v=1"></head><body class="buyer-page"><header><div class="bar"><div class="brand" onclick="location.href='index.html'"><a class="logo" href="index.html" title="Home"><img src="pasarmalam-logo.png" width="56" height="56" alt="PasarMalam"></a><div><h2>PasarMalam</h2><div>Chat</div></div></div><button class="soft" onclick="location.href=productId?'product.html?id='+productId:'index.html'">Produk</button></div></header><main><section class="panel"><h2>Chat Pembeli-Penjual</h2><div id="msgs">Loading...</div><div class="row"><input id="text" placeholder="Tanya penjual tentang harga, waranti atau ambil sendiri"><button class="primary" onclick="send()">Hantar</button></div></section></main><script>
const API="https://pasarmalam-backend.onrender.com";const productId=Number(new URLSearchParams(location.search).get("product_id"))||0;function esc(v){const e=document.createElement("span");e.textContent=v??"";return e.innerHTML}function token(){return localStorage.getItem("pm_token")||""}async function api(p,o={}){const headers={"Content-Type":"application/json",...(o.headers||{})};if(token())headers.Authorization=`Bearer ${token()}`;const r=await fetch(API+p,{...o,headers});const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");return d}function signedOut(){msgs.innerHTML="<p class='muted'>Sila log masuk untuk chat dengan penjual.</p><button class='soft' onclick=\"location.href='login.html'\">Log Masuk</button>"}async function load(){try{if(!token()){signedOut();return}const rows=((await api("/api/messages")).messages)||[];msgs.innerHTML=rows.filter(m=>!productId||Number(m.product_id)===productId).map(m=>`<div class="msg ${m.sender_role==="buyer"?"me":""}"><b>${m.sender_role==="buyer"?"Anda":m.seller_name}</b><p>${esc(m.body)}</p></div>`).join("")||"<p class='muted'>Belum ada mesej.</p>"}catch(e){msgs.textContent=e.message}}async function send(){try{if(!token()){signedOut();return}if(!productId||!text.value.trim()){msgs.textContent="Choose a product and enter your message.";return}await api("/api/messages",{method:"POST",body:JSON.stringify({product_id:productId,sender_role:"buyer",body:text.value})});text.value="";await load()}catch(e){msgs.textContent=e.message}}load();
</script><script src="badges.js?v=role-switch1"></script><script src="buyer-ui.js?v=2"></script></body></html>
