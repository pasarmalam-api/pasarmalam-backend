<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PasarMalam Shipping</title><style>:root{--brand:#0f9f8f;--purple:#6d5dfc;--line:#e6e9ef;--bg:#f5f7fb;--muted:#687282}body{margin:0;font-family:Arial,sans-serif;background:var(--bg)}header{background:linear-gradient(180deg,var(--brand),var(--purple));color:#fff}.bar,main{max-width:900px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}.brand{display:flex;gap:10px;align-items:center;cursor:pointer}.logo{width:50px;height:50px;border-radius:13px;background:#0f9f8f;display:grid;place-items:center;font-weight:900;box-shadow:inset 0 0 0 3px #ffffffcc}.panel,.rate{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin:16px}.rate{margin:8px 0}.soft{background:#fff;color:var(--brand);border:1px solid #b8fff5;border-radius:6px;min-height:38px;padding:0 14px;font-weight:900}.muted{color:var(--muted)}</style><link rel="icon" type="image/png" href="pasarmalam-logo.png"><link rel="stylesheet" href="buyer-ui.css?v=1"></head><body class="buyer-page"><header><div class="bar"><div class="brand" onclick="location.href='index.html'"><a class="logo" href="index.html" title="Home"><img src="pasarmalam-logo.png" width="56" height="56" alt="PasarMalam"></a><div><h2>PasarMalam</h2><div>Shipping Options</div></div></div><button class="soft" onclick="location.href='checkout.html'">Checkout</button></div></header><main><section class="panel"><h2>Logistics Rate</h2><div id="rates">Loading...</div></section></main><script>const API="https://pasarmalam-backend.onrender.com";async function load(){try{const r=await fetch(API+"/api/logistics/rates");const d=await r.json();if(!r.ok)throw new Error(d.error||"Delivery options unavailable");rates.innerHTML=(d.rates||[]).map(r=>`<div class="rate"><b>${r.method}</b><p class="muted">${r.fee==null?"Live quote at checkout":`RM${Number(r.fee).toFixed(2)}`} | ${r.eta}</p></div>`).join("")||"Delivery charges are calculated at checkout."; }catch(e){rates.textContent=e.message}}load()</script><script src="badges.js?v=role-switch2"></script><script src="buyer-ui.js?v=2"></script></body></html>
