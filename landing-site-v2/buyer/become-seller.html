<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Profile | PasarMalam</title><link rel="icon" href="pasarmalam-logo.png"><link rel="stylesheet" href="buyer-ui.css?v=1"><style>
.seller-profile{max-width:720px;margin:auto}.seller-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.seller-fields label{display:grid;gap:6px}.seller-fields input,.seller-fields select{width:100%;min-width:0}.seller-profile fieldset{border:0;padding:0;margin:24px 0}.seller-profile legend{font-weight:600;margin-bottom:14px}.seller-profile button{margin:12px 0}.seller-profile [hidden]{display:none!important}@media(max-width:560px){.seller-fields{grid-template-columns:1fr}}
</style></head><body class="buyer-page"><header><div class="bar"><div class="brand"><a class="logo" href="index.html"><img src="pasarmalam-logo.png" width="56" height="56" alt="PasarMalam"></a><div><h2>PasarMalam</h2><div>Seller Profile</div></div></div><a href="index.html">Continue Shopping</a></div></header>
<main><section class="seller-profile"><h2 id="heading">Complete Seller Profile</h2><p id="status" role="status" aria-live="polite">Loading your account...</p><a id="signIn" href="login.html?next=become-seller.html" hidden>Sign in to your existing account</a><button id="retry" type="button" hidden>Retry</button>
<form id="sellerProfile" hidden><fieldset><legend>Account Details</legend><div class="seller-fields">
<label>Full name<input name="name" required autocomplete="name"></label><label>Email<input name="email" readonly type="email" autocomplete="email"></label>
<label>Phone number<input name="phone" required type="tel" autocomplete="tel"></label><label>Pickup / shop address<input name="address" required autocomplete="street-address"></label>
</div></fieldset><fieldset><legend>Shop Details</legend><div class="seller-fields">
<label>Shop name<input name="shop_name" required></label><label>Shop category<select name="shop_category" required><option value="">Select category</option></select></label>
<label>Identity type<select name="identity_type" required><option value="">Select identity type</option><option>MyKad</option><option>Passport</option><option>Business Owner ID</option></select></label><label>Identity number<input name="identity_number" required></label>
<label>Business type (optional)<select name="business_type"><option value="">Select business type</option><option>Individual Seller</option><option>Sole Proprietor</option><option>Partnership</option><option>Private Limited / Sdn Bhd</option></select></label><label>SSM number (optional)<input name="ssm_number"></label>
</div></fieldset><fieldset><legend>Payout Bank Account</legend><div class="seller-fields"><label>Bank name<input name="bank_name" required></label><label>Account holder name<input name="bank_account_name" required></label><label>Account number<input name="bank_account_number" required inputmode="numeric"></label></div></fieldset>
<p>By submitting, you agree to the <a href="https://www.pasarmalamapp.com/seller/policies.html" target="_blank" rel="noopener">Seller Agreement</a>.</p><button class="primary" id="submit" type="submit">Complete Seller Profile</button></form>
<a id="support" href="support.html" hidden>Contact Support</a></section></main><script src="become-seller.js?v=1"></script><script src="buyer-ui.js?v=2"></script></body></html>
